services:
  influxdb:
    image: influxdb:1.8
    container_name: phimkhoi-k6-influxdb
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:10.4.3
    container_name: phimkhoi-k6-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb

  k6:
    image: grafana/k6:0.53.0
    container_name: phimkhoi-k6
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
      - BASE_URL=https://www.khoiphim.io.vn
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      - influxdb

volumes:
  influxdb_data:
  grafana_data:


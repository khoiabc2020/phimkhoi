  <rect x="148" y="228" width="12" height="10" rx="2" fill="#F4C84A" opacity="0.3"/>
  <rect x="148" y="246" width="12" height="10" rx="2" fill="#F4C84A" opacity="0.3"/>
  <rect x="148" y="264" width="12" height="10" rx="2" fill="#F4C84A" opacity="0.3"/>
  <rect x="240" y="228" width="12" height="10" rx="2" fill="#F4C84A" opacity="0.3"/>
  <rect x="240" y="246" width="12" height="10" rx="2" fill="#F4C84A" opacity="0.3"/>
  <rect x="240" y="264" width="12" height="10" rx="2" fill="#F4C84A" opacity="0.3"/>
  <line x1="160" y1="250" x2="240" y2="250" stroke="#F4C84A" stroke-width="1" opacity="0.2"/>
  <!-- Play triangle -->
